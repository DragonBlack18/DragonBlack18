name: README integrity
on:
  push:
    branches: [main]
    paths:
      - README.md
      - assets/**
      - scripts/verify_readme.py
      - .github/workflows/readme-integrity.yml
  pull_request:
    paths:
      - README.md
      - assets/**
      - scripts/verify_readme.py
      - .github/workflows/readme-integrity.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Markdown assets and links
        run: python3 scripts/verify_readme.py
