<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="378" viewBox="0 0 1280 378" role="img" aria-labelledby="title desc">
<title id="title">Davi Brand — Templar Engineering Terminal</title>
<desc id="desc">Banner gótico de engenharia: arquitetura de catedral em ruínas, espadas, cruz templária carmesim, interface de terminal e identidade profissional de Davi Brand.</desc>
<defs>
